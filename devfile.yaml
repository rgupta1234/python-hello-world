schemaVersion: 2.2.0
metadata:
  name: anaconda-workspace
components:
  - name: conda-tools
    container:
      image: continuumio/miniconda3:latest
      memoryLimit: 2Gi
      mountSources: true
      command: ["tail", "-f", "/dev/null"]
      endpoints:
        - name: jupyter
          targetPort: 8888
          exposure: public
          protocol: https
commands:
  - id: create-env
    exec:
      component: conda-tools
      commandLine: "conda env create -f environment.yml || conda env update -f environment.yml"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: build
        isDefault: true
  - id: run-jupyter
    exec:
      component: conda-tools
      commandLine: "conda run -n myenv jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: run
        isDefault: true
